name: Bug Report
description: File a bug report to help improve the portfolio website
title: "fix: [Short description of bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, Node version (if running locally).
      placeholder: |
        - OS: [e.g. macOS, Linux, Windows, iOS, Android]
        - Browser: [e.g. Chrome, Firefox, Safari]
        - Browser Version: [e.g. 120.0]
        - Node.js (if local): [e.g. 22.x]
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context, screenshots, or logs here.
    validations:
      required: false
